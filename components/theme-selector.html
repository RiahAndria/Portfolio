<div class="theme-selector" id="themeSelector" role="dialog" aria-labelledby="themeSelectorTitle">
  <div class="theme-selector-panel">
    <div class="theme-selector-intro">
      <p class="theme-selector-kicker">Bienvenue sur mon portfolio</p>
      <h1 id="themeSelectorTitle">Choix du thème</h1>
    </div>

    <div class="theme-selector-options">
      <button class="theme-selector-option theme-option-root" type="button" data-layout="terminal" data-theme="dark">
        <span class="theme-option-surface" aria-hidden="true"></span>
        <span class="theme-option-content">
          <span class="theme-option-name">Root<span class="theme-option-cursor" aria-hidden="true"></span></span>
          <span class="theme-option-desc">Une interface brute, immersive et technique.</span>
        </span>
      </button>

      <button class="theme-selector-option theme-option-zenith" type="button" data-layout="classic" data-theme="light">
        <span class="theme-option-surface" aria-hidden="true"></span>
        <span class="theme-option-content">
          <span class="theme-option-name">Zenith</span>
          <span class="theme-option-desc">Une présentation claire, lumineuse et organique.</span>
        </span>
      </button>

      <button class="theme-selector-option theme-option-eclipse" type="button" data-layout="classic" data-theme="dark">
        <span class="theme-option-surface" aria-hidden="true"></span>
        <span class="theme-option-content">
          <span class="theme-option-name">Eclipse</span>
          <span class="theme-option-desc">Une présentation sobre, sombre et confortable.</span>
        </span>
      </button>
    </div>
  </div>
</div>
